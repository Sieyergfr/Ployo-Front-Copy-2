name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ployo_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/ployo_ci"
      BETTER_AUTH_SECRET: "ci-only-secret-not-used-in-production-1234567890"
      BETTER_AUTH_URL: "http://localhost:3000"
      CRON_SECRET: "ci-only-cron-secret-not-used-in-production"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency-Vulnerabilitäts-Gate
        # Bricht bei critical-Findings ab. Für High gilt eine benannte
        # Ausnahmeliste statt eines pauschalen Warnhinweises für JEDEN
        # High-Fund (Audit-Finding L02): aktuell nur deepmerge-ts <8.0.0
        # (transitiv über @prisma/config -> prisma), deren einzige Behebung
        # (npm audit fix --force) prisma auf 6.12.0 downgraden würde. Reines
        # Dev-Tooling (Schema-Merging), kein Laufzeitpfad mit untrusted
        # Input – akzeptiertes Restrisiko, siehe Sicherheitsaudit L02. Ein
        # NEUER High-/Critical-Fund in einem anderen Paket bricht die
        # Pipeline weiterhin ab, siehe scripts/check-audit-allowlist.mjs.
        run: |
          npm audit --audit-level=critical
          node scripts/check-audit-allowlist.mjs

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Install ClamAV
        # Optional: die Virenscan-Tests (tests/virus-scan.test.ts) laufen nur
        # gegen einen echten clamd — ohne ihn überspringen sie sich selbst.
        # continue-on-error, damit ein Netzwerk-Hänger beim Signatur-Download
        # nicht die ganze Pipeline blockiert.
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clamav-daemon clamav-freshclam
          sudo freshclam --quiet || true
          sudo systemctl start clamav-daemon || true
          for i in $(seq 1 30); do
            [ -S /var/run/clamav/clamd.ctl ] && break
            sleep 1
          done

      - name: Test
        run: npm test

      - name: Create shadow database for drift check
        run: PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE ployo_ci_shadow;"

      - name: Check for schema drift
        # Meldet, wenn prisma/schema.prisma nicht durch die Migrationen
        # abgedeckt ist (Folge von `prisma db push` ohne Migration).
        run: |
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "postgresql://postgres:postgres@localhost:5432/ployo_ci_shadow" \
            --exit-code && echo "Keine Drift." || {
              echo "::warning::Schema weicht von den Migrationen ab (prisma db push ohne Migration?)."
            }

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E test
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
