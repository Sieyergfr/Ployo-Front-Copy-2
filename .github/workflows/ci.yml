name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./dev.db"
      BETTER_AUTH_SECRET: "ci-only-secret-not-used-in-production-1234567890"
      BETTER_AUTH_URL: "http://localhost:3000"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Check for schema drift
        # Meldet, wenn prisma/schema.prisma nicht durch die Migrationen
        # abgedeckt ist (Folge von `prisma db push` ohne Migration).
        run: |
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "file:./drift-check.db" \
            --exit-code && echo "Keine Drift." || {
              echo "::warning::Schema weicht von den Migrationen ab (siehe TODO-Offen.md, Punkt Postgres-Umzug)."
            }

      - name: Build
        run: npm run build
