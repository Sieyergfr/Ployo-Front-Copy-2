name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ployo_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/ployo_ci"
      BETTER_AUTH_SECRET: "ci-only-secret-not-used-in-production-1234567890"
      BETTER_AUTH_URL: "http://localhost:3000"
      CRON_SECRET: "ci-only-cron-secret-not-used-in-production"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Create shadow database for drift check
        run: PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE ployo_ci_shadow;"

      - name: Check for schema drift
        # Meldet, wenn prisma/schema.prisma nicht durch die Migrationen
        # abgedeckt ist (Folge von `prisma db push` ohne Migration).
        run: |
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "postgresql://postgres:postgres@localhost:5432/ployo_ci_shadow" \
            --exit-code && echo "Keine Drift." || {
              echo "::warning::Schema weicht von den Migrationen ab (prisma db push ohne Migration?)."
            }

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E test
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
