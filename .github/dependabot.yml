version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Sicherheitsrelevante Pakete einzeln prüfen, den Rest gebündelt.
      security-critical:
        patterns:
          - "better-auth"
          - "@prisma/client"
          - "prisma"
          - "next"
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
